<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#090D16"/>
        <stop offset="50%" stop-color="#111625"/>
        <stop offset="100%" stop-color="#0B0F19"/>
      </linearGradient>
      <radialGradient id="ambientGlow" cx="75%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FF6000" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#FF6000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#bgGrad)"/>
    <rect width="1280" height="720" fill="url(#ambientGlow)"/>
    
      <g transform="translate(720, 140)">
        <ellipse cx="240" cy="400" rx="220" ry="40" fill="#FF6000" opacity="0.15" filter="blur(20px)"/>

        <!-- Network Pulse Circles -->
        <circle cx="240" cy="240" r="180" fill="none" stroke="#FF6000" stroke-width="2" opacity="0.3" stroke-dasharray="8,8"/>
        <circle cx="240" cy="240" r="120" fill="none" stroke="#FF6000" stroke-width="3" opacity="0.5"/>

        <!-- Center Phone -->
        <rect x="175" y="140" width="130" height="230" rx="28" fill="#1E293B" stroke="#FF6000" stroke-width="5"/>
        <rect x="185" y="155" width="110" height="200" rx="18" fill="#0F172A"/>

        <!-- Floating Bidding Nodes -->
        <circle cx="90" cy="140" r="32" fill="#FF6000"/>
        <path d="M90 125 L98 145 H82 Z" fill="#FFFFFF"/>

        <circle cx="390" cy="180" r="32" fill="#FF6000"/>
        <path d="M390 165 L398 185 H382 Z" fill="#FFFFFF"/>

        <circle cx="340" cy="340" r="28" fill="#3B82F6"/>
      </g>
    
  </svg>