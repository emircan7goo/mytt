<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F0FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- Card body -->
  <rect x="14" y="28" width="68" height="42" rx="8" fill="url(#card)" opacity="0.95"/>
  <!-- Card stripe -->
  <rect x="14" y="40" width="68" height="12" fill="#7C3AED" opacity="0.4"/>
  <!-- Chip -->
  <rect x="22" y="51" width="14" height="10" rx="3" fill="#F59E0B" opacity="0.9"/>
  <line x1="25" y1="51" x2="25" y2="61" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
  <line x1="29" y1="51" x2="29" y2="61" stroke="#D97706" stroke-width="1.2" opacity="0.6"/>
  <!-- Contactless -->
  <path d="M50 53 Q54 49 54 56" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M50 53 Q58 46 58 56" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- 9 taksit badge -->
  <rect x="54" y="20" width="28" height="18" rx="9" fill="#F59E0B"/>
  <text x="68" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="10" fill="white">x9</text>
  <!-- Stars -->
  <circle cx="20" cy="22" r="2" fill="white" opacity="0.3"/>
  <circle cx="80" cy="74" r="2" fill="white" opacity="0.2"/>
</svg>
