<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- Phone body -->
  <rect x="28" y="14" width="40" height="66" rx="10" fill="white" opacity="0.95"/>
  <!-- Phone screen -->
  <rect x="32" y="24" width="32" height="44" rx="4" fill="#EDE9FE"/>
  <!-- Screen shine -->
  <rect x="32" y="24" width="12" height="44" rx="4" fill="white" opacity="0.15"/>
  <!-- Home indicator -->
  <rect x="40" y="72" width="16" height="3" rx="2" fill="#C4B5FD" opacity="0.7"/>
  <!-- Camera notch -->
  <rect x="42" y="17" width="12" height="4" rx="2" fill="#EDE9FE" opacity="0.7"/>
  <!-- NEW seal badge -->
  <rect x="54" y="12" width="28" height="20" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="68" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="7" fill="#5B21B6">NEW</text>
  <text x="68" y="29" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="6" fill="#7C3AED">SIFIR</text>
  <!-- Stars sparkle -->
  <path d="M18 30 L19.2 26 L20.4 30 L24 31.2 L20.4 32.4 L19.2 36 L18 32.4 L14.4 31.2 Z" fill="white" opacity="0.5"/>
  <path d="M76 58 L77 55 L78 58 L81 59 L78 60 L77 63 L76 60 L73 59 Z" fill="white" opacity="0.35"/>
  <!-- Checkmark on screen -->
  <path d="M37 45 L43 52 L58 36" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
