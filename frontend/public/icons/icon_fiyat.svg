<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(110,231,183,0.25)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0.15)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="rgba(52,211,153,0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect width="96" height="96" rx="24" fill="url(#spotlight)"/>
  <!-- Grid lines futuristic -->
  <line x1="0" y1="32" x2="96" y2="32" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <line x1="0" y1="64" x2="96" y2="64" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <line x1="32" y1="0" x2="32" y2="96" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <line x1="64" y1="0" x2="64" y2="96" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <!-- Price tag glass shape -->
  <path d="M54 16 L76 16 Q82 16 82 22 L82 50 L52 80 Q48 84 44 80 L18 54 Q14 50 18 46 L48 18 Q51 16 54 16Z" fill="url(#tagGrad)" stroke="#A78BFA" stroke-width="1.5" opacity="0.9"/>
  <!-- Hole -->
  <circle cx="70" cy="26" r="4.5" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="70" cy="26" r="1.5" fill="#A78BFA"/>
  <!-- Down arrow neon -->
  <path d="M40 30 L40 52" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <path d="M30 46 L40 58 L50 46" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.9"/>
  <!-- TL symbol -->
  <text x="57" y="44" font-family="system-ui,sans-serif" font-weight="900" font-size="16" fill="#C4B5FD" opacity="0.85" filter="url(#glow)">₺</text>
  <!-- Scan lines -->
  <line x1="58" y1="52" x2="74" y2="52" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="59" x2="74" y2="59" stroke="#A78BFA" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="62" y1="66" x2="74" y2="66" stroke="#A78BFA" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  <!-- Corner dots -->
  <circle cx="12" cy="12" r="2" fill="#A78BFA" opacity="0.4"/>
  <circle cx="84" cy="12" r="2" fill="#A78BFA" opacity="0.4"/>
  <circle cx="84" cy="84" r="2" fill="#A78BFA" opacity="0.4"/>
  <circle cx="12" cy="84" r="2" fill="#A78BFA" opacity="0.4"/>
</svg>
