<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(110,231,183,0.2)"/>
      <stop offset="100%" stop-color="rgba(16,185,129,0.1)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bolt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </radialGradient>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#bg)"/>
  <!-- Circuit lines bg -->
  <line x1="0" y1="48" x2="96" y2="48" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
  <line x1="48" y1="0" x2="48" y2="96" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.1"/>
  <!-- Left phone glass -->
  <rect x="8" y="22" width="24" height="40" rx="6" fill="url(#phoneGrad)" stroke="#34d399" stroke-width="1.2" opacity="0.9"/>
  <rect x="12" y="28" width="16" height="26" rx="3" fill="#022c22" opacity="0.6"/>
  <rect x="12" y="28" width="16" height="26" rx="3" fill="#34d399" opacity="0.08"/>
  <!-- Left phone screen glow -->
  <rect x="13" y="29" width="14" height="24" rx="2" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.5"/>
  <rect x="17" y="57" width="8" height="2" rx="1" fill="#34d399" opacity="0.4"/>
  <!-- Right phone glass -->
  <rect x="64" y="22" width="24" height="40" rx="6" fill="url(#phoneGrad)" stroke="#34d399" stroke-width="1.2" opacity="0.9"/>
  <rect x="68" y="28" width="16" height="26" rx="3" fill="#022c22" opacity="0.6"/>
  <rect x="68" y="28" width="16" height="26" rx="3" fill="#34d399" opacity="0.08"/>
  <rect x="69" y="29" width="14" height="24" rx="2" fill="none" stroke="#34d399" stroke-width="0.5" opacity="0.5"/>
  <rect x="73" y="57" width="8" height="2" rx="1" fill="#34d399" opacity="0.4"/>
  <!-- Arc signals left -->
  <path d="M35 36 Q30 42 35 48" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M38 33 Q31 42 38 51" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Arc signals right -->
  <path d="M61 36 Q66 42 61 48" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M58 33 Q65 42 58 51" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <!-- Neon lightning bolt center -->
  <path d="M53 18 L42 44 L50 44 L39 72 L60 40 L51 40 Z" fill="url(#bolt)" filter="url(#glow)" opacity="0.95"/>
  <path d="M53 18 L42 44 L50 44 L39 72 L60 40 L51 40 Z" fill="white" opacity="0.3"/>
  <!-- Particles -->
  <circle cx="48" cy="12" r="2" fill="#34d399" opacity="0.6" filter="url(#glow)"/>
  <circle cx="48" cy="80" r="2" fill="#34d399" opacity="0.5" filter="url(#glow)"/>
  <circle cx="6" cy="48" r="1.5" fill="#34d399" opacity="0.4"/>
  <circle cx="90" cy="48" r="1.5" fill="#34d399" opacity="0.4"/>
</svg>
