version: '3.8'

# ── Production Docker Compose ─────────────────────────────────────────────────
# Kullanım:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Gerekli .env.prod dosyası (örnek için .env.prod.example'a bakın):
#   DATABASE_URL, JWT_SECRET, PAYTR_*, SMTP_*, FRONTEND_URL, vb.

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: mytt-db
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${DB_USER:-mytt}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mytt_prod}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mytt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mytt-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - internal
    restart: unless-stopped

  # ── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mytt-backend
    env_file: .env.prod
    environment:
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mytt.com}
    container_name: mytt-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mytt.com}
    networks:
      - internal
    depends_on:
      - backend
    restart: unless-stopped

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: mytt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro         # SSL sertifikaları (Let's Encrypt)
      - uploads:/var/www/uploads:ro           # Static file serving
    networks:
      - internal
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  uploads:
